[package]
name = "loger"
version = "0.1.0"
edition = "2021"
description = "Auditoria leve para servidores Linux: logins, comandos, arquivos sensiveis, rede e sistema"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
